<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrim calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1819; --pink:#F5A3C4; --pinkL:#FBD3E3; --pinkXL:#FFF0F6; --white:#FFFBFD;
  --sub:rgba(27,24,25,.5); --faint:rgba(27,24,25,.18);
  --px:"Archivo","Helvetica Neue",Arial,sans-serif;
  --head:"Archivo","Helvetica Neue",Arial,sans-serif;
  --script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  --cond:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--ink);font-family:var(--px);-webkit-font-smoothing:antialiased}

.w{position:relative;max-width:420px;margin:10px auto 14px;border-radius:4px;overflow:hidden;padding:20px 16px 18px;
  background:linear-gradient(180deg,#F9C6DA 0%,#FCE1EC 38%,var(--white) 78%);
  box-shadow:0 1px 4px rgba(0,0,0,.25)}
.w:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(rgba(255,255,255,.75) 32%,transparent 36%) 0 0/6px 6px;
  -webkit-mask:linear-gradient(180deg,#000 0%,transparent 40%);mask:linear-gradient(180deg,#000 0%,transparent 40%)}
.grain{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.35;mix-blend-mode:multiply;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .95  0 0 0 0 .55  0 0 0 0 .7  0 0 0 .25 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* decorations */
.ph{position:absolute;pointer-events:none}
.big{width:76px;top:10px;right:18px;transform:rotate(8deg);filter:drop-shadow(0 0 6px rgba(245,163,196,.6))}
.hstar{position:absolute;pointer-events:none;width:78px;top:30px;right:92px;transform:rotate(-8deg);z-index:1}
.spk{width:16px;top:18px;right:110px}
.s{position:absolute;line-height:1;pointer-events:none;font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans",sans-serif}
.s1{top:8px;right:104px;font-size:13px;color:var(--ink);transform:rotate(-12deg)}
.s2{top:62px;right:10px;font-size:17px;color:var(--ink);transform:rotate(14deg)}
.s3{top:58px;right:170px;font-size:11px;color:var(--pink)}
.hs{position:absolute;width:70px;height:70px;bottom:-22px;right:-18px;transform:rotate(-8deg);pointer-events:none;z-index:1}
.hs span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1;font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans",sans-serif}
.halo{font-size:82px;color:transparent;background:radial-gradient(var(--pink) 40%,transparent 44%) 0 0/4px 4px;-webkit-background-clip:text;background-clip:text;
  -webkit-mask:radial-gradient(circle at 50% 54%,#000 30%,transparent 66%);mask:radial-gradient(circle at 50% 54%,#000 30%,transparent 66%)}
.core{font-size:46px;color:var(--pink)}

/* header */
.top{position:relative;z-index:2}
.mon{display:inline-block;white-space:nowrap;font-family:var(--head);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em;text-transform:uppercase;color:var(--ink);padding-left:4px}
.mon i{font-family:var(--script);font-style:normal;font-weight:400;text-transform:none;font-size:1.5em;color:var(--ink);letter-spacing:0;margin-right:0;position:relative;top:8px;line-height:.5}
.yrw{display:flex;align-items:center;margin-top:4px}
.yr{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.12em;padding:0 2px}
.gap{width:22px}
.arrow{background:none;border:none;color:var(--sub);font-family:var(--px);font-size:14px;cursor:pointer;padding:0 5px}
.lab{display:inline-block;margin-top:8px;background:var(--ink);color:var(--pink);font-size:11px;padding:3px 8px;letter-spacing:.06em;font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans",sans-serif}

/* controls */
.ctl{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.nav{display:flex;align-items:center;gap:2px}
.nav button{background:none;border:none;font-family:var(--head);font-weight:600;color:var(--ink);font-size:13px;letter-spacing:.12em;padding:2px 5px;cursor:pointer}
.nav .a{color:#4F4549;font-weight:700;-webkit-text-stroke:.35px #4F4549}
.seg{display:flex;gap:3px}
.seg button{-webkit-appearance:none;appearance:none;border-radius:0;background:#FFF8FB;border:1px solid #000;font-family:var(--head);font-weight:600;font-size:12px;color:var(--ink);width:24px;height:22px;cursor:pointer}
.seg button.on{background:#3B3638;color:var(--pink);box-shadow:inset 0 0 3px 1px rgba(0,0,0,.55),inset 0 3px 4px rgba(0,0,0,.55)}
.seg button:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}

/* panel */
.panel{position:relative;z-index:2}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#1B1819}
.h{font-family:var(--head);font-weight:500;font-size:10.5px;text-align:center;padding:4px 0 3px;background:var(--ink);color:var(--pink);letter-spacing:.06em}
.d{position:relative;height:38px;display:flex;justify-content:flex-end;align-items:flex-start;padding:4px 6px 0 0;font-size:13px;color:var(--ink);background:#FFF8FB}
.d.o{color:var(--sub);background:radial-gradient(rgba(205,150,174,.34) 22%,transparent 26%) 0 0/4px 4px,#FFF8FB}
.num{position:relative;z-index:0}
.num.t{color:#fff;font-weight:600}
.num.t:before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:28px;height:26px;transform:translate(-50%,-48%);
  background:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2022%27%3E%3Cpath%20fill%3D%27%23F07AAA%27%20d%3D%27M12%2021.2%2010.6%2020C5.4%2015.4%202%2012.3%202%208.4%202%205.3%204.4%203%207.4%203c1.7%200%203.4.8%204.6%202.1C13.2%203.8%2014.9%203%2016.6%203%2019.6%203%2022%205.3%2022%208.4c0%203.9-3.4%207-8.6%2011.6L12%2021.2z%27/%3E%3C/svg%3E") center/contain no-repeat;opacity:.62;pointer-events:none}

.list,.big2{padding:14px;min-height:118px;background:#FFF8FB;border-top:1px solid #1B1819;border-bottom:1px solid #1B1819}
.list .dt{font-family:var(--head);font-weight:600;font-size:24px;letter-spacing:-.02em}
.list .ln{margin:8px 0;height:.75px;background:var(--pink)}
.list p{font-size:14px}
.big2{text-align:center}
.big2 .n{font-family:var(--head);font-weight:600;font-size:60px;line-height:1}
.big2 .s0{font-family:var(--script);font-size:30px;color:#F07AAA;margin-top:2px}
</style>
</head>

<script>
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["MON","TUE","WED","THU","FRI","SAT","SUN"];
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let now=new Date(); now.setHours(0,0,0,0);
let cur=new Date(now), view="M";
const p=n=>String(n).padStart(2,"0");
const same=(a,b)=>a.getTime()===b.getTime();
/* Weekly scrim schedule (0=Sun ... 6=Sat): [start time, maps] */
const WEEKLY={1:["21:00",2],2:["20:00",3],6:["20:00",3],0:["20:00",3]};
function cell(d,out){
  const e=document.createElement("div");e.className="d"+(out?" o":"");
  const n=document.createElement("span");n.className="num"+(same(d,now)?" t":"");n.textContent=p(d.getDate());
  e.appendChild(n);return e;
}
function head(g){WD.forEach(w=>{const h=document.createElement("div");h.className="h";h.textContent=w;g.appendChild(h)})}
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function draw(){
  const mn=MN[cur.getMonth()];document.getElementById("mon").innerHTML="<i>"+mn[0]+"</i>"+mn.slice(1);fitInitial();
  document.getElementById("yr").textContent=cur.getFullYear();
  const b=document.getElementById("body");b.innerHTML="";
  if(view==="M"||view==="W"){
    const g=document.createElement("div");g.className="grid";head(g);
    let start,count;
    if(view==="M"){
      const first=new Date(cur.getFullYear(),cur.getMonth(),1);start=mondayOf(first);
      const last=new Date(cur.getFullYear(),cur.getMonth()+1,0);
      const end=new Date(last);end.setDate(end.getDate()+(6-((last.getDay()+6)%7)));
      count=Math.round((end-start)/864e5)+1;
    }else{start=mondayOf(cur);count=7}
    for(let i=0;i<count;i++){const d=new Date(start);d.setDate(start.getDate()+i);
      g.appendChild(cell(d,view==="M"&&d.getMonth()!==cur.getMonth()))}
    b.appendChild(g);
  }else if(view==="D"){
    b.innerHTML='<div class="big2"><div class="n">'+p(cur.getDate())+'</div><div class="s0">'+DL[cur.getDay()]+'</div></div>';
  }else{
    const s=WEEKLY[cur.getDay()];
    b.innerHTML='<div class="list"><div class="dt">'+DN[cur.getDay()]+', '+MN[cur.getMonth()].slice(0,3)+' '+p(cur.getDate())+'</div><div class="ln"></div>'+
      '<p>'+(s?'Scrim '+s[0]+' '+s[1]+' maps':'No schedule')+'</p></div>';
  }
}

/* close the gap between the script initial and the rest of the word, per letter */
const _cv=document.createElement("canvas").getContext("2d");
function fitInitial(){
  const i=document.querySelector("#mon i");if(!i)return;
  const cs=getComputedStyle(i);
  _cv.font=cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;
  const m=_cv.measureText(i.textContent);
  if(!m||m.actualBoundingBoxRight===undefined)return;
  i.style.marginRight=(Math.min(0,m.actualBoundingBoxRight-m.width)-parseFloat(cs.fontSize)*0.06).toFixed(1)+"px";
}
function fitAgain(i){const cs=getComputedStyle(i);_cv.font=cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;const m=_cv.measureText(i.textContent);i.style.marginRight=(Math.min(0,m.actualBoundingBoxRight-m.width)-parseFloat(cs.fontSize)*0.06).toFixed(1)+"px"}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fitInitial);document.fonts.load('66px "Great Vibes"').then(fitInitial).catch(()=>{})}
function shift(dir){
  if(view==="M")cur=new Date(cur.getFullYear(),cur.getMonth()+dir,1);
  else{cur=new Date(cur);cur.setDate(cur.getDate()+dir*(view==="W"?7:1))}
  draw();
}
document.getElementById("prev").onclick=()=>shift(-1);
document.getElementById("next").onclick=()=>shift(1);
document.getElementById("today").onclick=()=>{cur=new Date(now);draw()};
document.getElementById("py").onclick=()=>{cur=new Date(cur.getFullYear()-1,cur.getMonth(),1);draw()};
document.getElementById("ny").onclick=()=>{cur=new Date(cur.getFullYear()+1,cur.getMonth(),1);draw()};
document.querySelectorAll("#seg button").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));
  btn.classList.add("on");view=btn.dataset.v;
  if(view!=="M"&&cur.getMonth()===now.getMonth()&&cur.getFullYear()===now.getFullYear())cur=new Date(now);
  draw();
});
function refresh(){const t=new Date();t.setHours(0,0,0,0);if(!same(t,now)){now=t;draw()}}
setInterval(refresh,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
draw();
</script>
