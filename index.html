<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calendar</title>
<style>
:root{
  --bg:#FCF1F6; --cell:#FCF1F6; --gap:#FFFFFF; --out:#F6EEF1;
  --ink:#2F2B2D; --sub:#7A7476; --faint:#9C9598; --on:#F3EBEE;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Apple SD Gothic Neo",Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.w{position:relative;max-width:400px;margin:8px auto;background:var(--bg);border-radius:4px;padding:20px 14px 14px}
.top{display:flex;align-items:center;justify-content:center;gap:10px}
.top b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.arrow{background:none;border:none;color:#5f5a5c;font-size:17px;cursor:pointer;padding:0 6px;border-radius:4px;line-height:1.4}
.bar{display:flex;justify-content:center;align-items:center;gap:22px;margin:10px 0 12px}
.nav{display:flex;align-items:center;padding:3px 4px;gap:4px}
.nav button{background:none;border:none;font-family:inherit;color:var(--ink);font-size:10.5px;padding:2px 8px;cursor:pointer}
.nav .a{font-size:14px;line-height:1;color:#5f5a5c}
.seg{display:flex;align-items:center;gap:2px}
.seg button{background:none;border:none;font-family:inherit;color:#5f5a5c;font-size:10.5px;width:22px;height:22px;border-radius:3px;cursor:pointer}
.seg button.on{background:var(--on);color:var(--ink);box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.seg button:active{box-shadow:inset 0 1px 3px rgba(0,0,0,.16)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);column-gap:1px;row-gap:1px;background:var(--gap)}
.h{background:var(--bg);text-align:center;font-size:12px;font-weight:600;color:var(--ink);padding:2px 0 3px}
.d{background:var(--cell);height:37px;display:flex;align-items:flex-start;justify-content:flex-end;padding:4px 6px 0 0;font-size:11.5px;color:var(--sub)}
.d.o{background:var(--out)}
.num{position:relative;z-index:0}
.num.t:before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none}

.list{background:var(--cell);border:1px solid var(--gap);padding:14px;font-size:12px;color:var(--sub);min-height:120px}
.list p+p{margin-top:8px}
.big{background:var(--cell);border:1px solid var(--gap);padding:18px;text-align:center}
.big .n{font-size:40px;font-weight:700}
.big .s{font-size:12px;color:var(--sub);margin-top:4px}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <b id="mon"></b>
    <button class="arrow" id="py" aria-label="previous year">‹</button>
    <b id="yr"></b>
    <button class="arrow" id="ny" aria-label="next year">›</button>
  </div>
  <div class="bar">
    <div class="nav">
      <button id="prev" class="a" aria-label="previous">‹</button>
      <button id="today">Today</button>
      <button id="next" class="a" aria-label="next">›</button>
    </div>
    <div class="seg" id="seg">
      <button data-v="M" class="on">M</button>
      <button data-v="W">W</button>
      <button data-v="D">D</button>
      <button data-v="A">A</button>
    </div>
  </div>
  <div id="body"></div>
</div>
<script>
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
let now=new Date(); now.setHours(0,0,0,0);
let cur=new Date(now), view="M";
const p=n=>String(n).padStart(2,"0");
const same=(a,b)=>a.getTime()===b.getTime();

function cell(d,out){
  const e=document.createElement("div");
  e.className="d"+(out?" o":"");
  const n=document.createElement("span");n.className="num"+(same(d,now)?" t":"");n.textContent=p(d.getDate());
  e.appendChild(n);
  return e;
}
function head(g){WD.forEach(w=>{const h=document.createElement("div");h.className="h";h.textContent=w;g.appendChild(h)})}
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}

function draw(){
  document.getElementById("mon").textContent=MN[cur.getMonth()];
  document.getElementById("yr").textContent=cur.getFullYear();
  const b=document.getElementById("body"); b.innerHTML="";
  if(view==="M"||view==="W"){
    const g=document.createElement("div");g.className="grid";head(g);
    let start,count;
    if(view==="M"){
      const first=new Date(cur.getFullYear(),cur.getMonth(),1);
      start=mondayOf(first);
      const last=new Date(cur.getFullYear(),cur.getMonth()+1,0);
      const end=new Date(last);end.setDate(end.getDate()+(6-((last.getDay()+6)%7)));
      count=Math.round((end-start)/864e5)+1;
    }else{start=mondayOf(cur);count=7}
    for(let i=0;i<count;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);
      g.appendChild(cell(d,view==="M"&&d.getMonth()!==cur.getMonth()));
    }
    b.appendChild(g);
  }else if(view==="D"){
    b.innerHTML='<div class="big"><div class="n">'+p(cur.getDate())+'</div><div class="s">'+
      ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][cur.getDay()]+", "+MN[cur.getMonth()]+" "+cur.getFullYear()+'</div></div>';
  }else{
    drawAgenda(b);
  }
}

/* Weekly scrim schedule (0=Sun ... 6=Sat): [start time, maps] */
const WEEKLY={1:["21:00",2],2:["20:00",3],6:["20:00",3],0:["20:00",3]};
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function drawAgenda(b){
  const d=cur, s=WEEKLY[d.getDay()];
  let h='<div class="list"><p><b>'+DN[d.getDay()]+', '+MN[d.getMonth()].slice(0,3)+' '+p(d.getDate())+'</b></p>';
  h+= s ? '<p>Scrim '+s[0]+' '+s[1]+' maps</p>' : '<p>No schedule</p>';
  b.innerHTML=h+'</div>';
}
function shift(dir){
  if(view==="M")cur=new Date(cur.getFullYear(),cur.getMonth()+dir,1);
  else{cur=new Date(cur);cur.setDate(cur.getDate()+dir*(view==="W"?7:1))}
  draw();
}
document.getElementById("prev").onclick=()=>shift(-1);
document.getElementById("next").onclick=()=>shift(1);
document.getElementById("today").onclick=()=>{cur=new Date(now);draw()};
document.getElementById("py").onclick=()=>{cur=new Date(cur.getFullYear()-1,cur.getMonth(),1);draw()};
document.getElementById("ny").onclick=()=>{cur=new Date(cur.getFullYear()+1,cur.getMonth(),1);draw()};
document.querySelectorAll("#seg button").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));
  btn.classList.add("on");view=btn.dataset.v;if(view!=="M"&&cur.getMonth()===now.getMonth()&&cur.getFullYear()===now.getFullYear())cur=new Date(now);draw();
});
draw();
setInterval(()=>{const t=new Date();t.setHours(0,0,0,0);if(!same(t,now)){now=t;draw()}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const t=new Date();t.setHours(0,0,0,0);if(!same(t,now)){now=t;draw()}}});
</script>
</body>
</html>
